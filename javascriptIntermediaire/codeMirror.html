<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor - Dark Theme</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        require.config({
            paths: {
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs'
            }
        });

        require(['vs/editor/editor.main'], function () {
            const editor = monaco.editor.create(document.getElementById('container'), {
                value: `// Bienvenue dans Monaco Editor
// Raccourcis clavier disponibles :
//
// CTRL + F : Rechercher
// CTRL + H : Rechercher et remplacer
// CTRL + C : Copier
// CTRL + X : Couper
// CTRL + V : Coller
// CTRL + Z : Annuler
// CTRL + Y : Refaire
// CTRL + A : Tout sélectionner
// CTRL + D : Sélectionner le mot suivant
// CTRL + / : Commenter/décommenter
// ALT + ↑/↓ : Déplacer la ligne
// SHIFT + ALT + ↑/↓ : Dupliquer la ligne
// CTRL + L : Sélectionner la ligne
// CTRL + Shift + K : Supprimer la ligne
// CTRL + ] : Indenter
// CTRL + [ : Désindenter
// F11 : Plein écran

function exemple() {
    console.log("Commencez à coder !");
}`,
                language: 'javascript',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: {
                    enabled: true
                },
                scrollBeyondLastLine: false,
                wordWrap: 'on',
                lineNumbers: 'on',
                renderWhitespace: 'selection',
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: 'on',
                smoothScrolling: true,
                formatOnPaste: true,
                formatOnType: true,
                quickSuggestions: true,
                suggestOnTriggerCharacters: true,
                acceptSuggestionOnEnter: 'on',
                tabCompletion: 'on',
                mouseWheelZoom: true,
                contextmenu: true,
                find: {
                    autoFindInSelection: 'never',
                    seedSearchStringFromSelection: 'always'
                }
            });

            // Focus automatique sur l'éditeur
            editor.focus();

            // Ajuster la taille lors du redimensionnement
            window.addEventListener('resize', () => {
                editor.layout();
            });
        });
    </script>
</body>

</html>

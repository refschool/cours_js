<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Openweathermap</title>
</head>

<body>
    La température est de <span id="temperature"></span>

    <div>

        <input type="text" id="ville">
        <input type="submit" id="btn" value="Check météo">

    </div>
</body>
<script>
    const btn = document.getElementById('btn')
    const apikey = 'f1739d80d7f0995ce57277d5861a6566'
    // Application programming interface

    btn.addEventListener('click', function (event) {

        // on va chercher la valeur dans l'input
        const villeElement = document.getElementById('ville')
        const ville = villeElement.value

        const url = `https://api.openweathermap.org/data/2.5/weather?q=${ville}&appid=${apikey}`

        // on va chercher la météo de la ville
        fetch(url)
            .then(responseBrute => responseBrute.json())
            .then(dataJson => {
                let temperatureElement = document.getElementById('temperature')
                console.log(dataJson)
                //console.log("Dans fetch", dataJson.main.temp - 273)

                temperatureElement.innerHTML = ville + " est de " + (dataJson.main.temp - 273).toFixed(1) + " °C"
                villeElement.value = ""
            })


    })

</script>

</html>
